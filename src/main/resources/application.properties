spring.application.name=ecom-order-service

server.port=8044

logging.level.com.microservice.order.ecomorderservice.client=DEBUG

logging.level.com.netflix.discovery=DEBUG
logging.level.org.springframework.cloud.netflix.eureka=DEBUG

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.registry-fetch-interval-seconds=30
eureka.instance.lease-renewal-interval-in-seconds=30

# Resilience4j Rate Limiter Configuration
resilience4j.ratelimiter.instances.inventoryService.limit-for-period=2
resilience4j.ratelimiter.instances.inventoryService.limit-refresh-period=10s
resilience4j.ratelimiter.instances.inventoryService.timeout-duration=0s

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.inventoryServiceCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventoryServiceCircuitBreaker.slow-call-rate-threshold=50

resilience4j.circuitbreaker.instances.inventoryServiceCircuitBreaker.sliding-window-size=6
resilience4j.circuitbreaker.instances.inventoryServiceCircuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.inventoryServiceCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.inventoryServiceCircuitBreaker.wait-duration-in-open-state=10s

resilience4j.circuitbreaker.instances.inventoryServiceCircuitBreaker.max-wait-duration-in-half-open-state=5s
resilience4j.circuitbreaker.instances.inventoryServiceCircuitBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.inventoryServiceCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true

#Only record the exceptions that are specified in the record-exceptions property. All other exceptions will be ignored.
resilience4j.circuitbreaker.instances.inventoryServiceCircuitBreaker.record-exceptions=java.lang.RuntimeException,java.io.IOException,org.springframework.web.client.HttpServerErrorException
resilience4j.circuitbreaker.instances.inventoryServiceCircuitBreaker.ignore-exceptions=java.lang.IllegalArgumentException

#BulkHead Configuration
resilience4j.bulkhead.instances.inventoryServiceBulkhead.max-concurrent-calls=2
#resilience4j.bulkhead.instances.inventoryServiceBulkhead.max-wait-duration=0s //0s means that if the bulkhead is full, the call will be rejected immediately. If you want to wait for a certain duration before rejecting the call, you can set a positive value for max-wait-duration.
resilience4j.bulkhead.instances.inventoryServiceBulkhead.max-wait-duration=10s

spring.cloud.openfeign.client.config.ecom-inventory-service.connectTimeout=2000
spring.cloud.openfeign.client.config.ecom-inventory-service.readTimeout=30000

#Bulkhead Thread Configuration
resilience4j.bulkhead.instances.inventoryServiceThreadPool.max-thread-pool-size=3
resilience4j.bulkhead.instances.inventoryServiceThreadPool.core-thread-pool-size=1
resilience4j.bulkhead.instances.inventoryServiceThreadPool.queue-capacity=0